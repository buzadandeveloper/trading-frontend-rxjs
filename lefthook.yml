pre-commit:
  parallel: true
  commands:
    prettier:
      glob: "*.{ts,tsx,js,jsx,json,css,md}"
      run: pnpm prettier --write {staged_files}
      stage_fixed: true
    rslint:
      glob: "*.{ts,tsx,js,jsx}"
      run: pnpm rslint --fix {staged_files}
      stage_fixed: true
    tsc:
      glob: 'src/**/*.{ts,tsx}'
      run: pnpm type:check
    madge:
      glob: "src/**/*.{ts,tsx}"
      run: pnpm circular:check

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
